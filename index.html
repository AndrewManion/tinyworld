<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tiny World</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime&display=swap" rel="stylesheet" />
<style>
  body {
    font-family: 'Courier Prime', monospace;
    margin: 0;
    height: 100vh;
    width: 100vw;
    background: black;
    overflow-x: hidden;
    cursor: none;
    color: white;
  }

  /* -------- FILM GRAIN -------- */
  body::after {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 9998;
    opacity: 0.045;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
    background-repeat: repeat;
    background-size: 180px 180px;
    animation: grain 0.4s steps(1) infinite;
  }

  @keyframes grain {
    0%   { background-position: 0 0; }
    10%  { background-position: -30px -60px; }
    20%  { background-position: 60px 30px; }
    30%  { background-position: -80px 20px; }
    40%  { background-position: 40px -70px; }
    50%  { background-position: -20px 80px; }
    60%  { background-position: 70px -40px; }
    70%  { background-position: -60px 60px; }
    80%  { background-position: 20px -20px; }
    90%  { background-position: -40px 40px; }
    100% { background-position: 10px -80px; }
  }

  /* -------- TYPEWRITER INTRO -------- */
  #intro {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: white;
    z-index: 50;
  }

  #intro-text {
    font-family: 'Courier Prime', monospace;
    font-size: 8vw;
    white-space: nowrap;
    overflow: hidden;
    border-right: 2px solid black;
    color: black;
    animation: typing 4s steps(19, end) 1s 1 normal both, blink-caret 0.7s step-end infinite;
    letter-spacing: 0.02em;
  }

  @keyframes typing { from { width: 0; } to { width: 16ch; } }
  @keyframes blink-caret { 50% { border-color: transparent; } }

  /* -------- MAIN -------- */
  #main {
    display: none;
    grid-template-columns: 1fr 280px;
    height: 100vh;
    width: 100vw;
    background: black;
    overflow: hidden;
    position: relative;
  }

  /* LEFT SIDE */
  #left {
    position: relative;
    height: 100vh;
    width: 100%;
    overflow: hidden;
  }

  #slideshow {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: opacity 0.5s ease-in-out;
  }

  /* -------- CAMERA SHUTTER -------- */
  #shutter-white {
    position: absolute;
    inset: 0;
    background: white;
    opacity: 0;
    z-index: 2;
    pointer-events: none;
    transition: opacity 0s;
  }

  #shutter-black {
    position: absolute;
    inset: 0;
    background: black;
    opacity: 0;
    z-index: 1;
    pointer-events: none;
    transition: opacity 0s;
  }

  /* -------- SLIDE WORD -------- */
  #slide-word {
    position: absolute;
    bottom: 3rem;
    left: 3rem;
    font-family: 'Courier Prime', monospace;
    font-size: 3vw;
    color: white;
    text-shadow: 1px 1px 12px rgba(0,0,0,0.7);
    z-index: 5;
    letter-spacing: 0.03em;
    overflow: hidden;
    white-space: nowrap;
    border-right: 2px solid white;
    width: 0;
  }

  #slide-word.typing {
    animation: wordType var(--type-duration) steps(var(--type-steps), end) forwards,
               wordCaret 0.6s step-end infinite;
  }

  #slide-word.done {
    border-color: transparent;
  }

  @keyframes wordType  { from { width: 0; } to { width: var(--type-width); } }
  @keyframes wordCaret { 50% { border-color: transparent; } }

  #site-nav {
    position: absolute;
    top: 1rem;
    left: 1rem;
    z-index: 10;
  }

  /* RIGHT SIDE MENU */
  #right {
    border-left: 1px solid rgba(255,255,255,0.5);
    display: flex;
    flex-direction: column;
    justify-content: space-evenly;
    padding: 2rem 0;
    position: relative;
    z-index: 3;
  }

  .menu-item {
    display: flex;
    align-items: center;
    justify-content: flex-start;
    gap: 0.75rem;
    text-transform: uppercase;
    font-weight: bold;
    cursor: pointer;
    color: white;
    background: black;
    padding: 1rem;
    transition: all 0.3s ease;
    position: relative;
    letter-spacing: 0.08em;
    font-size: 0.85rem;
  }

  .menu-item::after {
    content: "";
    position: absolute;
    bottom: 0;
    left: 30px;
    width: 80%;
    border-bottom: 1px solid rgba(255,255,255,0.4);
  }

  .menu-item:last-child::after { content: none; }

  .menu-item img {
    width: 60px;
    height: 60px;
    object-fit: cover;
    flex-shrink: 0;
    transition: transform 0.35s ease;
    filter: grayscale(20%);
  }

  .menu-item:hover {
    background: white;
    color: black;
  }

  .menu-item:hover img {
    transform: scale(1.06);
    filter: grayscale(0%);
  }

  /* HEADER LINKS */
  #site-nav a {
    color: white;
    background: black;
    padding: 0.4rem 0.8rem;
    margin: 0 0.3rem;
    transition: all 0.3s ease;
    text-decoration: none;
    font-size: 0.8rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  #site-nav a:hover {
    background: white;
    color: black;
    text-decoration: none;
  }

  /* CURSOR */
  .dot-cursor {
    position: fixed;
    border-radius: 50%;
    pointer-events: none;
    transform: translate(-50%, -50%);
    z-index: 9999;
    transition: background 0.25s ease, transform 0.15s ease;
  }

  #intro-dot {
    width: 20px;
    height: 20px;
    background: black;
    display: block;
  }

  #main-dot {
    width: 20px;
    height: 20px;
    background: white;
    display: none;
    mix-blend-mode: difference;
  }

  /* MOBILE */
  @media (max-width: 768px) {
    body { cursor: auto; overflow-y: auto; }
    #main { display: none !important; }

    #mobile {
      display: flex !important;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      width: 100%;
      padding: 1.5rem;
      background: #000;
      color: white;
    }

    #mobile-slideshow {
      width: 100%;
      height: 200px;
      position: relative;
      overflow: hidden;
      margin-bottom: 1.5rem;
    }

    #mobile-slideshow img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: opacity 0.6s ease-in-out;
    }

    #mobile-slide-word {
      position: absolute;
      bottom: 0.5rem;
      left: 1rem;
      font-family: 'Courier Prime', monospace;
      font-size: 1.2rem;
      color: white;
      text-shadow: 1px 1px 8px black;
      overflow: hidden;
      white-space: nowrap;
      border-right: 2px solid white;
      width: 0;
    }

    #mobile-slide-word.typing {
      animation: wordType var(--type-duration) steps(var(--type-steps), end) forwards,
                 wordCaret 0.6s step-end infinite;
    }

    #mobile-slide-word.done {
      border-color: transparent;
    }

    .mobile-menu {
      width: 100%;
      text-align: center;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      border-top: 1px solid white;
      padding: 1rem 0;
      cursor: pointer;
      color: white;
      font-size: 0.85rem;
    }

    .mobile-menu:last-of-type { border-bottom: 1px solid white; }
    .mobile-menu:hover { background: white; color: black; }

    #mobile-gallery {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      width: 100%;
      margin-top: 1rem;
    }

    .mobile-item {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 1rem;
      cursor: pointer;
      text-transform: uppercase;
      font-weight: bold;
      letter-spacing: 0.06em;
      font-size: 0.85rem;
    }

    .mobile-item img {
      width: 60px;
      height: 60px;
      object-fit: cover;
    }
  }
</style>
</head>
<body>

  <!-- INTRO -->
  <div id="intro"><div id="intro-text">Gran Colombia...</div></div>

  <!-- MAIN -->
  <div id="main" class="grid">
    <div id="left">
      <div id="site-nav"></div>
      <img id="slideshow" src="assets/images/buenosaires.webp" alt="slideshow">
      <div id="slide-word">pequeño</div>
      <div id="shutter-white"></div>
      <div id="shutter-black"></div>
    </div>

    <div id="right">
      <div class="menu-item" onclick="window.location.href='EsbonNgecha.htm'"><img src="assets/images/title/esbon.webp" alt="Esbon"><span>Esbon</span></div>
      <div class="menu-item" onclick="window.location.href='valparaiso.htm'"><img src="assets/images/title/valparaiso.webp" alt="Valparaiso"><span>Valparaiso</span></div>
      <div class="menu-item" onclick="window.location.href='GillesParis.htm'"><img src="assets/images/title/gilles.webp" alt="Gilles"><span>Gilles</span></div>
      <div class="menu-item" onclick="window.location.href='morocco.htm'"><img src="assets/images/title/morocco.webp" alt="Morocco"><span>Morocco</span></div>
      <div class="menu-item" onclick="window.location.href='BrigitteCannes.htm'"><img src="assets/images/title/brigitte.webp" alt="Brigitte"><span>Brigitte</span></div>
    </div>
  </div>

  <!-- MOBILE -->
  <div id="mobile" style="display:none;">
    <div id="mobile-slideshow">
      <img id="mobile-slide" src="assets/images/buenosaires.webp" alt="slideshow">
      <div id="mobile-slide-word">pequeño</div>
    </div>

    <div class="mobile-menu" onclick="window.location.href='journey.html'">Journey</div>
    <div class="mobile-menu" onclick="window.location.href='interviews.html'">Interviews</div>
    <div class="mobile-menu" onclick="window.location.href='portfolio.htm'">Portfolio</div>
    <div class="mobile-menu" onclick="window.location.href='map.html'">Map</div>
    <div class="mobile-menu" onclick="window.location.href='about.htm'">About</div>

    <div id="mobile-gallery">
      <div class="mobile-item" onclick="window.location.href='EsbonNgecha.htm'"><img src="assets/images/title/esbon.webp" alt="Esbon"><span>Esbon</span></div>
      <div class="mobile-item" onclick="window.location.href='Valparaiso.htm'"><img src="assets/images/title/valparaiso.webp" alt="Valparaiso"><span>Valparaiso</span></div>
      <div class="mobile-item" onclick="window.location.href='GillesParis.htm'"><img src="assets/images/title/gilles.webp" alt="Gilles"><span>Gilles</span></div>
      <div class="mobile-item" onclick="window.location.href='Morocco.htm'"><img src="assets/images/title/morocco.webp" alt="Morocco"><span>Morocco</span></div>
      <div class="mobile-item" onclick="window.location.href='BrigitteCannes.htm'"><img src="assets/images/title/brigitte.webp" alt="Brigitte"><span>Brigitte</span></div>
    </div>
  </div>

  <!-- CURSORS -->
  <div class="dot-cursor" id="intro-dot"></div>
  <div class="dot-cursor" id="main-dot"></div>

  <script>
    const intro       = document.getElementById('intro');
    const main        = document.getElementById('main');
    const mobile      = document.getElementById('mobile');
    const introDot    = document.getElementById('intro-dot');
    const mainDot     = document.getElementById('main-dot');
    const slideshow   = document.getElementById("slideshow");
    const shutterW    = document.getElementById("shutter-white");
    const shutterB    = document.getElementById("shutter-black");
    const slideWord   = document.getElementById("slide-word");
    const mobileSlide = document.getElementById("mobile-slide");
    const mobileWord  = document.getElementById("mobile-slide-word");

    // Load header
    fetch("header.html")
      .then(res => res.text())
      .then(html => document.getElementById("site-nav").innerHTML = html)
      .catch(err => console.error("Header load error:", err));

    // Cursor tracking
    document.addEventListener('mousemove', e => {
      introDot.style.left = e.clientX + 'px';
      introDot.style.top  = e.clientY + 'px';
      mainDot.style.left  = e.clientX + 'px';
      mainDot.style.top   = e.clientY + 'px';
    });

    // Slides
    const slides = [
      { src: "assets/images/buenosaires.webp",          word: "pequeño"   },
      { src: "assets/images/patagonia_condor 4.webp",   word: "nguillen"  },
      { src: "assets/images/mendoza_house tour.webp",   word: "chiquito"  },
      { src: "assets/images/valparaiso.webp",           word: "pequeñito" },
      { src: "assets/images/uk.webp",                   word: "tiny"      },
      { src: "assets/images/flers.webp",                word: "petit"     },
      { src: "assets/images/paris.webp",                word: "minuscule" },
      { src: "assets/images/dolomites.webp",            word: "piccolo"   },
      { src: "assets/images/kitzbuhel.webp",            word: "winzig"    }
    ];
    slides.forEach(s => new Image().src = s.src);
    let index = 0;

    // Typewriter helper
    function typeWord(el, word) {
      el.textContent = word;
      el.classList.remove('typing', 'done');
      el.style.width = '0';
      // measure full width
      el.style.width = 'auto';
      const fullWidth = el.scrollWidth + 'px';
      el.style.width = '0';
      el.style.setProperty('--type-width', fullWidth);
      el.style.setProperty('--type-steps', word.length);
      el.style.setProperty('--type-duration', (word.length * 80) + 'ms');
      // force reflow then start
      void el.offsetWidth;
      el.classList.add('typing');
      // stop caret after typing finishes
      setTimeout(() => {
        el.classList.remove('typing');
        el.classList.add('done');
        el.style.width = fullWidth;
      }, word.length * 80 + 50);
    }

    // Show first word on load (after a beat)
    setTimeout(() => typeWord(slideWord, slides[0].word), 400);

    function nextSlide() {
      // 1. Clear current word
      slideWord.classList.remove('typing', 'done');
      slideWord.style.width = '0';
      mobileWord.classList.remove('typing', 'done');
      mobileWord.style.width = '0';

      // 2. Camera shutter
      setTimeout(() => {
        shutterW.style.transition = 'opacity 0.04s ease';
        shutterW.style.opacity = 0.85;

        setTimeout(() => {
          shutterW.style.transition = 'opacity 0.08s ease';
          shutterW.style.opacity = 0;
          shutterB.style.transition = 'opacity 0.08s ease';
          shutterB.style.opacity = 1;

          setTimeout(() => {
            index = (index + 1) % slides.length;
            slideshow.src = slides[index].src;
            mobileSlide.src = slides[index].src;

            shutterB.style.transition = 'opacity 0.28s ease';
            shutterB.style.opacity = 0;

            // Typewrite the new word in
            setTimeout(() => {
              typeWord(slideWord, slides[index].word);
              typeWord(mobileWord, slides[index].word);
            }, 180);

          }, 120);
        }, 60);
      }, 200);
    }

    // Hover effect for cursor
    function setHoverEffect(selector) {
      document.querySelectorAll(selector).forEach(item => {
        item.addEventListener('mouseenter', () => {
          mainDot.style.transform = 'translate(-50%, -50%) scale(1.5)';
        });
        item.addEventListener('mouseleave', () => {
          mainDot.style.transform = 'translate(-50%, -50%) scale(1)';
        });
      });
    }

    setHoverEffect('.menu-item, .mobile-menu, #site-nav a');

    // Intro transition
    intro.addEventListener('click', () => {
      intro.style.transition = 'opacity 0.6s ease';
      intro.style.opacity = 0;
      setTimeout(() => {
        intro.style.display = 'none';
        introDot.style.display = 'none';
        if (window.innerWidth <= 768) {
          mobile.style.display = 'flex';
          setTimeout(() => typeWord(mobileWord, slides[0].word), 400);
          setInterval(nextSlide, 4000);
        } else {
          main.style.display = 'grid';
          mainDot.style.display = 'block';
          setInterval(nextSlide, 4000);
        }
      }, 600);
    });
  </script>
</body>
</html>
